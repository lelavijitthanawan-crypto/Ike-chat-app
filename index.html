<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ike Eveland Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Murecho:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="window">
        <div class="title-bar">
            <div class="left-section">
                <div class="story-ring">
                    <div class="pixel-avatar avatar-element"></div>
                </div>
                <span id="version-link" title="Click to upload custom avatar">Ike Eveland</span>
                <input type="file" id="avatar-input" accept="image/*" style="display: none;">
            </div>
            <div class="right-controls">
                <span class="action-icon" onclick="openSettingsModal()">⚙️</span>
                <span class="action-icon" onclick="openResetModal()">⟳</span>
            </div>
        </div>
        <div class="main-body">
            <div id="chat-screen"></div>
        </div>
        <div class="input-box">
            <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
            <button class="send-btn" onclick="send()">SEND</button>
        </div>
    </div>
    <div id="reset-modal" class="modal-overlay">
        <div class="modal-content">
            <h4>Clear chat history?</h4>
            <p style="font-size: 13px; color: #666; margin: 10px 0;">All chat history will be deleted.</p>
            <button class="modal-btn" onclick="closeResetModal()">Cancel</button>
            <button class="modal-btn" style="background: #ff4d4d; color: #fff;" onclick="resetChat()">Clear</button>
        </div>
    </div>
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 320px; text-align: left;">
            <h4 style="margin-bottom: 12px; color: var(--header);">⚙️ Setting</h4>
            <label style="font-size: 12px; font-weight: bold;">Groq API Key:</label>
            <input type="password" id="setting-api-key" placeholder="gsk_..."
                style="width: 100%; padding: 6px; margin: 4px 0 10px; border-radius: 6px; border: 1px solid #ccc;">
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="modal-btn" onclick="closeSettingsModal()">Cancel</button>
                <button class="modal-btn" style="background: var(--header); color: #fff;"
                    onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
</body>

</html>
